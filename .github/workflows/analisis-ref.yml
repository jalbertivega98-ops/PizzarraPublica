name: Analisis video referencia
on:
  push:
    branches: [analisis-ref-tmp]
permissions:
  contents: write
jobs:
  analisis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fotogramas y transcripción
        continue-on-error: true
        run: |
          mkdir -p analisis/sb
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/143.0 Safari/537.36"
          curl -sL -A "$UA" -H "Accept-Language: es-ES,es" "https://www.youtube.com/watch?v=bWZHWv0aMSI&hl=es" -o tmp_watch.html
          ls -la tmp_watch.html
          for n in 1 2 3 maxresdefault; do curl -sfL "https://i.ytimg.com/vi/bWZHWv0aMSI/$n.jpg" -o analisis/thumb_$n.jpg || true; done
          python3 - <<'PY'
          import re, json, urllib.request
          h = open("tmp_watch.html", encoding="utf-8", errors="ignore").read()
          m = re.search(r'"playerStoryboardSpecRenderer":\{"spec":"([^"]+)"', h)
          print("spec", bool(m))
          L = re.search(r'"lengthSeconds":"(\d+)"', h); print("len", L and L.group(1))
          open("analisis/len.txt","w").write(L.group(1) if L else "")
          if m:
              spec = m.group(1).encode().decode("unicode_escape")
              open("analisis/spec.txt","w").write(spec)
              parts = spec.split("|")
              base = parts[0]
              for li, lv in enumerate(parts[1:]):
                  w,hh,count,cols,rows,interval,name,sigh = lv.split("#")
                  print("nivel", li, w, hh, count, cols, rows, interval, name)
              li = len(parts) - 2
              w,hh,count,cols,rows,interval,name,sigh = parts[-1].split("#")
              per = int(cols)*int(rows); n = (int(count)+per-1)//per
              for i in range(n):
                  url = base.replace("$L", str(li)).replace("$N", name.replace("$M", str(i))) + "&sigh=" + sigh
                  try:
                      open(f"analisis/sb/M{i:03d}.jpg","wb").write(urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"}), timeout=30).read())
                  except Exception as e:
                      print("sb", i, e)
              json.dump({"w":w,"h":hh,"count":count,"cols":cols,"rows":rows,"interval_ms":interval}, open("analisis/sb/info.json","w"))
          PY
          curl -sL -A "$UA" "https://youtubetotranscript.com/transcript?v=bWZHWv0aMSI&current_language_code=es" -o analisis/transcript.html || true
          ls -la analisis analisis/sb | head -60
      - name: Guardar
        if: always()
        run: |
          git add analisis
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "analisis referencia 2" && git push
