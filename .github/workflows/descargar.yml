name: Descargar archivos

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Pares destino=url separados por espacios (destino relativo al repo)"
        required: true

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        env:
          URLS: ${{ inputs.urls }}
        run: |
          for p in $URLS; do d="${p%%=*}"; u="${p#*=}"; case "$d" in *..*|/*) echo "ruta no válida $d"; continue;; esac; mkdir -p "$(dirname "$d")"; curl -sfL -o "$d" "$u" && echo "ok $d"; done
      - name: Guardar
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Archivos descargados"
            git push
          fi
