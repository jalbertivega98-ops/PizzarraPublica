name: Voces v2

on:
  workflow_dispatch:
    inputs:
      videos:
        description: "Guiones a locutar (pipeline/v2/videos/*.py)"
        required: false
        default: "pipeline/v2/videos/*.py"

permissions:
  contents: write

concurrency:
  group: voces-v2
  cancel-in-progress: false

jobs:
  voces:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Instalar edge-tts
        run: pip install edge-tts==7.2.8
      - name: Generar voces con tiempos por palabra
        run: python3 pipeline/v2/voz.py ${{ inputs.videos }}
      - name: Guardar las voces en el repositorio
        run: |
          git add pipeline/v2/voces
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Voces v2 (Álvaro, con tiempos por palabra)"
            for i in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" && git push && break
              sleep 5
            done
          fi
