name: Voces ElevenLabs

on:
  workflow_dispatch:
    inputs:
      muestras:
        description: "Texto para probar varias voces (vacío = generar las frases de los storyboards)"
        required: false
        default: ""
      motor:
        description: "elevenlabs o edge (voces gratis de Microsoft)"
        required: false
        default: "elevenlabs"
      biblioteca:
        description: "Con muestras: cuántas voces de España probar de la biblioteca (0 = voces básicas)"
        required: false
        default: "0"
      storyboards:
        description: "Storyboards a locutar"
        required: false
        default: "storyboards/impuestos_*.json"
      voice:
        description: "voice_id de ElevenLabs (vacío = el del storyboard)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: voces-elevenlabs
  cancel-in-progress: false

jobs:
  voces:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Instalar edge-tts y ffmpeg
        run: |
          pip install edge-tts==7.3.1
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Generar voces
        working-directory: pipeline
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MUESTRAS: ${{ inputs.muestras }}
          STORYBOARDS: ${{ inputs.storyboards }}
          VOICE: ${{ inputs.voice }}
          BIBLIOTECA: ${{ inputs.biblioteca }}
          MOTOR: ${{ inputs.motor }}
        run: |
          case "$STORYBOARDS" in pizzaville-pruebas:*)
            for f in ${STORYBOARDS#pizzaville-pruebas:}; do python3 ../pizzaville/voz/pruebas_voz.py $f; done
            exit 0;;
          esac
          case "$STORYBOARDS" in pizzaville-eleven:*)
            for f in ${STORYBOARDS#pizzaville-eleven:}; do python3 ../pizzaville/voz/voz_eleven.py $f $VOICE; done
            exit 0;;
          esac
          case "$STORYBOARDS" in pizzaville:*)
            for g in ${STORYBOARDS#pizzaville:}; do python3 ../pizzaville/voz/voz_edge.py ../pizzaville/voz/$g; done
            exit 0;;
          esac
          if [ -n "$MUESTRAS" ]; then
            python3 tts_elevenlabs.py --muestras "$MUESTRAS" --biblioteca "${BIBLIOTECA:-0}" --motor "${MOTOR:-elevenlabs}"
          else
            python3 tts_elevenlabs.py $STORYBOARDS ${VOICE:+--voice "$VOICE"} --motor "${MOTOR:-elevenlabs}"
          fi
      - name: Guardar las voces en el repositorio
        if: always()
        run: |
          git add pipeline/voces_elevenlabs pizzaville/public/voz || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Voces de ElevenLabs"
            git push
          fi
