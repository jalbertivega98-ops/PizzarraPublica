<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root{--bg:#0d1117;--panel:#161b22;--recv:#262d38;--sent:#2f6fed;--txt:#f2f4f8;--muted:#8b95a7}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Inter,"Noto Color Emoji",sans-serif;color:var(--txt)}
  #hook{position:absolute;left:60px;right:60px;top:110px;text-align:center;z-index:5}
  #hook span{display:inline-block;background:#ffe14d;color:#111;font:800 62px/1.18 Inter,"Noto Color Emoji";padding:18px 30px;border-radius:22px;box-shadow:0 10px 0 rgba(0,0,0,.35)}
  #head{position:absolute;left:0;right:0;top:330px;height:140px;background:var(--panel);display:flex;align-items:center;padding:0 60px;gap:28px;border-bottom:2px solid #222a35;z-index:4}
  #head .av{width:92px;height:92px;border-radius:50%;background:#3a4252;display:flex;align-items:center;justify-content:center;font-size:48px}
  #head .nm{font:700 48px Inter,"Noto Color Emoji"}
  #head .st{font:500 32px Inter;color:var(--muted);margin-top:4px;height:38px}
  #view{position:absolute;left:0;right:0;top:470px;height:1010px;overflow:hidden}
  #list{position:absolute;left:0;right:0;top:0;padding:30px 150px 40px 60px;will-change:transform}
  .row{display:flex;margin-bottom:26px}
  .row.yo{justify-content:flex-end}
  .row.sis{justify-content:center}
  .b{max-width:720px;padding:22px 30px 24px;border-radius:38px;background:var(--recv);font:500 46px/1.28 Inter,"Noto Color Emoji";transform-origin:left bottom;word-wrap:break-word}
  .row.yo .b{background:var(--sent);transform-origin:right bottom;border-bottom-right-radius:12px}
  .row.otro .b{border-bottom-left-radius:12px}
  .b .who{font:700 32px Inter;margin-bottom:6px}
  .sisb{background:#1f2630;color:var(--muted);font:600 32px Inter,"Noto Color Emoji";padding:12px 26px;border-radius:24px}
  .map{width:600px;height:330px;border-radius:24px;overflow:hidden;position:relative;margin-top:8px;background:#dfe6d8}
  .map svg{position:absolute;inset:0}
  .map .lbl{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.72);font:600 32px Inter;padding:12px 20px;color:#fff}
  #typing{position:absolute;left:60px;display:none}
  #typing .b{display:flex;gap:14px;align-items:center;padding:30px 34px}
  #typing .who{font:700 32px Inter;margin-right:6px}
  .dot{width:20px;height:20px;border-radius:50%;background:#9aa4b5}
  #input{position:absolute;left:40px;right:40px;top:1500px;height:120px;background:var(--panel);border-radius:60px;display:flex;align-items:center;padding:0 40px;font:500 44px Inter,"Noto Color Emoji";color:var(--muted);gap:20px}
  #input .t{flex:1;white-space:nowrap;overflow:hidden}
  #input .t span{color:var(--txt)}
  #input .cur{display:inline-block;width:4px;height:50px;background:var(--sent);vertical-align:middle;margin-left:4px}
  #send{width:84px;height:84px;border-radius:50%;background:#2a3140;display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;flex:none}
  #final{position:absolute;left:60px;right:60px;top:760px;text-align:center;opacity:0;z-index:6}
  #final span{display:inline-block;background:#fff;color:#111;font:800 64px/1.2 Inter,"Noto Color Emoji";padding:28px 36px;border-radius:30px;box-shadow:0 14px 0 rgba(0,0,0,.4)}
  #wm{position:absolute;right:60px;top:1650px;font:700 34px Inter;color:rgba(255,255,255,.35)}
</style></head>
<body>
<div id="hook"><span></span></div>
<div id="head"><div class="av"></div><div><div class="nm"></div><div class="st"></div></div></div>
<div id="view"><div id="list"></div><div id="typing"><div class="b"><span class="who"></span><i class="dot"></i><i class="dot"></i><i class="dot"></i></div></div></div>
<div id="input"><div class="t"><span></span></div><div id="send">➤</div></div>
<div id="final"><span></span></div>
<div id="wm"></div>
<script>
const $=s=>document.querySelector(s);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x,0,1);return 1-Math.pow(1-x,3)};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const MAPSVG=`<svg viewBox="0 0 600 330" width="600" height="330"><rect width="600" height="330" fill="#e3e9dc"/>
<g stroke="#fff" stroke-width="22" fill="none"><path d="M-10 90 L610 140"/><path d="M180 -10 L240 340"/><path d="M-10 260 L610 230"/><path d="M430 -10 L400 340"/></g>
<rect x="250" y="150" width="140" height="70" rx="8" fill="#f6c8c8"/><text x="320" y="194" font-size="34" text-anchor="middle" fill="#c0392b" font-family="Inter" font-weight="800">H</text>
<g transform="translate(320 120)"><path d="M0 0 C-26 -30 -26 -62 0 -62 C26 -62 26 -30 0 0Z" fill="#e53935"/><circle cy="-42" r="10" fill="#fff"/></g></svg>`;

window.setup=function(G,opt){
  window.G=G; opt=opt||{};
  $('#hook span').textContent=G.hook||'';
  $('#head .nm').textContent=G.chat;
  $('#head .av').textContent=(G.avatar||G.chat.match(/\p{Extended_Pictographic}/u)?.[0]||G.chat[0]);
  $('#final span').textContent=G.final||'';
  $('#wm').textContent=G.marca||'';
  const yo=G.yo||'yo', L=$('#list'), P=G.personas||{};
  const grupo=Object.keys(P).filter(k=>k!==yo).length>1 || G.grupo;
  G.mensajes.forEach((m,i)=>{
    const r=document.createElement('div');
    const tipo=m.de==='sistema'?'sis':(m.de===yo?'yo':'otro');
    r.className='row '+tipo; r.id='m'+i;
    if(tipo==='sis') r.innerHTML=`<div class="b sisb">${esc(m.texto)}</div>`;
    else{
      let who=(tipo==='otro'&&grupo)?`<div class="who" style="color:${P[m.de]?.color||'#fff'}">${esc(P[m.de]?.nombre||m.de)}</div>`:'';
      let body=m.tipo==='mapa'?`<div class="map">${MAPSVG}<div class="lbl">📍 ${esc(m.texto)}</div></div>`:esc(m.texto);
      r.innerHTML=`<div class="b">${who}${body}</div>`;
    }
    r.style.visibility='hidden'; L.appendChild(r);
  });
  // timeline
  let t=opt.inicio??0.9; const ev=[], T=[];
  G.mensajes.forEach((m,i)=>{
    const n=(m.texto||'').length, p=m.pausa||0;
    if(m.de==='sistema'){T.push({i,show:t});ev.push({t,s:'sys'});t+=1.1+p;return;}
    if(m.de===yo){
      const d=clamp(n*0.045,0.6,2.2); T.push({i,typeA:t,typeB:t+d,show:t+d+0.15});
      for(let k=0;k<n;k++) ev.push({t:t+d*k/n,s:'key'});
      t+=d+0.15; ev.push({t,s:'sent'}); t+=clamp(0.5+n*0.03,0.7,1.8)+p; return;
    }
    const d=m.tipo==='mapa'?1.0:clamp(0.45+n*0.022,0.7,1.6);
    T.push({i,dotsA:t,show:t+d,de:m.de}); t+=d; ev.push({t,s:'recv'});
    t+=(m.tipo==='mapa'?1.8:clamp(0.6+n*0.042,0.9,3.0))+p;
  });
  G._T=T; G._final=t; G.dur=t+(G.final?2.8:0.8); G.ev=ev;
  // measure
  G._bot=T.map(x=>{const e=$('#m'+x.i);return e.offsetTop+e.offsetHeight+26});
  return {dur:G.dur,events:ev};
};

window.draw=function(t){
  const G=window.G,T=G._T,VH=1010,TY=110;
  let off=0,prevOff=0,offT=-9, typing=null, inText='';
  const target=(k,extra)=>Math.max(0,(k>=0?G._bot[k]:30)+extra-VH+20);
  let last=-1;
  T.forEach((x,k)=>{
    const e=document.getElementById('m'+x.i);
    if(t>=x.show){
      last=k; e.style.visibility='visible';
      const a=ease((t-x.show)/0.22);
      e.firstElementChild.style.transform=`scale(${0.7+0.3*a})`; e.style.opacity=a;
    } else e.style.visibility='hidden';
    if(x.dotsA!==undefined && t>=x.dotsA && t<x.show) typing=x;
    if(x.typeA!==undefined && t>=x.typeA && t<x.show){
      const s=G.mensajes[x.i].texto, n=Math.round(s.length*clamp((t-x.typeA)/(x.typeB-x.typeA),0,1));
      inText=s.slice(0,n);
    }
  });
  // scroll: compute offset target timeline
  let cur=0; let from=0, at=-9, to=0;
  T.forEach((x,k)=>{
    if(x.dotsA!==undefined && t>=x.dotsA){ const tg=target(k-1,TY); if(tg!==to){from=valAt(from,to,at,x.dotsA);to=tg;at=x.dotsA;} }
    if(t>=x.show){ const tg=target(k,0); if(tg!==to){from=valAt(from,to,at,x.show);to=tg;at=x.show;} }
  });
  function valAt(f,tt,a,now){return f+(tt-f)*ease((now-a)/0.3)}
  cur=valAt(from,to,at,t);
  $('#list').style.transform=`translateY(${-cur}px)`;
  const ty=$('#typing');
  if(typing){
    ty.style.display='block'; const base=last>=0?G._bot[last]:30; ty.style.top=(base-cur)+'px';
    const P=G.personas[typing.de]||{}; ty.querySelector('.who').textContent=P.nombre||'';
    ty.querySelector('.who').style.color=P.color||'#fff';
    ty.querySelectorAll('.dot').forEach((d,j)=>{d.style.transform=`translateY(${-10*Math.max(0,Math.sin((t*7)-j*0.9))}px)`});
  } else ty.style.display='none';
  $('#head .st').textContent=typing?((G.personas[typing.de]||{}).nombre+' está escribiendo…'):'en línea';
  const it=$('#input .t span'); it.innerHTML=inText?esc(inText.length>27?'…'+inText.slice(-26):inText)+'<i class="cur"></i>':'';
  if(!inText) $('#input .t span').innerHTML='<span style="color:#8b95a7">Mensaje</span>';
  $('#send').style.background=inText?'#2f6fed':'#2a3140';
  const f=$('#final'); const fa=ease((t-G._final-0.3)/0.35);
  f.style.opacity=G.final?fa:0; f.style.transform=`scale(${0.85+0.15*fa})`;
  $('#hook').style.transform=`scale(${0.9+0.1*ease(t/0.35)})`;
};
</script></body></html>
