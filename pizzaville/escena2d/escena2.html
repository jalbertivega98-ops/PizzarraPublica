const smooth = (x) => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x)
function track(t, keys) {
  if (t <= keys[0][0]) return keys[0][1]
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1] = keys[i], [t0, v0] = keys[i - 1]
    if (t <= t1) return v0 + (v1 - v0) * smooth((t - t0) / Math.max(1e-6, t1 - t0))
  }
  return keys[keys.length - 1][1]
}

// ---------- characters ----------
function headShape(c, who) {
  c.beginPath()
  if (who === 'ella') { c.moveTo(0, -84); c.bezierCurveTo(46, -84, 66, -50, 66, -8); c.bezierCurveTo(66, 40, 40, 80, 0, 84); c.bezierCurveTo(-40, 80, -66, 40, -66, -8); c.bezierCurveTo(-66, -50, -46, -84, 0, -84) }
  else { c.moveTo(0, -86); c.bezierCurveTo(48, -86, 70, -52, 70, -8); c.bezierCurveTo(70, 44, 52, 80, 0, 88); c.bezierCurveTo(-52, 80, -70, 44, -70, -8); c.bezierCurveTo(-70, -52, -48, -86, 0, -86) }
  c.closePath()
}
function drawHead(c, who, s, mouth, t) {
  const L = who === 'ella' ? P.her : P.him
  const fx = s.yaw * 24

  c.fillStyle = L.hair

    for (let i = 0; i < 9; i++) { const a = -2.6 + i * 0.65; c.beginPath(); c.arc(Math.cos(a) * 66 - s.yaw * 6, Math.sin(a) * 70 + 10, 30, 0, 7); c.fill() }

    // bun
    c.beginPath(); c.arc(-8 - s.yaw * 10, -110, 36, 0, 7); c.fill()
    c.fillStyle = L.hairL; c.beginPath(); c.arc(-14 - s.yaw * 10, -118, 14, 0, 7); c.fill()
  }
  // ears
  c.fillStyle = L.skinD
  c.beginPath(); c.ellipse(-68 - s.yaw * 10, 4, 12, 20, 0, 0, 7); c.fill(); c.beginPath(); c.ellipse(68 - s.yaw * 10, 4, 12, 20, 0, 0, 7); c.fill()
  if (who === 'ella') { c.fillStyle = '#e2c05a'; c.beginPath(); c.arc(-68 - s.yaw * 10, 26, 5, 0, 7); c.fill() }
  // face
  headShape(c, who); c.fillStyle = L.skin; c.fill()
  c.save(); headShape(c, who); c.clip()
  // side shading on the turned side
  { const sx = s.yaw > 0 ? -80 : 80, g = c.createRadialGradient(sx, 0, 10, sx, 0, 75); g.addColorStop(0, `rgba(120,60,40,${0.05 + Math.abs(s.yaw) * 0.12})`); g.addColorStop(1, 'rgba(120,60,40,0)'); c.fillStyle = g; c.fillRect(-90, -100, 180, 200) }
  if (who === 'el') { // stubble, soft edge along the jaw and moustache
    c.filter = 'blur(2.5px)'; c.fillStyle = 'rgba(45,28,22,0.17)'
    c.beginPath(); c.moveTo(-70, 26); c.quadraticCurveTo(-40, 48, fx - 20, 40); c.quadraticCurveTo(fx, 34, fx + 20, 40); c.quadraticCurveTo(40, 48, 70, 26); c.lineTo(70, 100); c.lineTo(-70, 100); c.closePath(); c.fill()
    c.filter = 'none'
  }
  c.restore()
  // eyes
  const eW = who === 'ella' ? 14 : 13, eH = who === 'ella' ? 8.5 : 7.5
  for (const side of [-1, 1]) {
    const ex = fx + side * 27 + s.yaw * side * 2, ey = -4
    c.save(); c.translate(ex, ey)
    c.beginPath(); c.ellipse(0, 0, eW, eH, 0, 0, 7); c.fillStyle = '#f6efe6'; c.fill()
    c.save(); c.clip()
    c.fillStyle = '#3a2418'; c.beginPath(); c.arc(s.gx * 6.5, s.gy * 3.5, 6, 0, 7); c.fill()
    c.fillStyle = '#120b08'; c.beginPath(); c.arc(s.gx * 6.5, s.gy * 3.5, 3, 0, 7); c.fill()
    c.fillStyle = 'rgba(255,255,255,0.85)'; c.beginPath(); c.arc(s.gx * 6.5 + 2, s.gy * 3.5 - 2, 1.5, 0, 7); c.fill()
    // upper lid covers from the top

    c.fillStyle = L.skin; c.fillRect(-eW - 2, -eH - 4, eW * 2 + 4, lidY + eH + 4)
    c.restore()
    c.strokeStyle = '#2b1a14'; c.lineWidth = who === 'ella' ? 3.2 : 2.6; c.lineCap = 'round'
    c.beginPath(); c.moveTo(-eW - 1, Math.max(-1, lidY) * 0.6); c.quadraticCurveTo(0, Math.min(lidY, eH) - 1.5, eW + 1, Math.max(-1, lidY) * 0.6 - 1); c.stroke()
    if (who === 'ella') { c.beginPath(); c.moveTo(side * (eW + 1), Math.max(-1, lidY) * 0.6 - 1); c.lineTo(side * (eW + 6), Math.max(-1, lidY) * 0.6 - 5); c.stroke() }
    c.restore()
  }
  // brows
  c.strokeStyle = L.hair; c.lineCap = 'round'; c.lineWidth = who === 'ella' ? 5 : 7
  for (const side of [-1, 1]) {
    const raise = (side < 0 ? s.browL : s.browR) * 9, inner = (s.browIn || 0) * 6
    const x0 = fx + side * 13, x1 = fx + side * 41, y = -28 - raise

    c.fillStyle = '#5a2a24'

    c.fillStyle = '#f3ece4'; c.beginPath(); c.ellipse(mx, my - 2 + open * 1, 10 - open * 2, Math.min(3, open * 6), 0, Math.PI, 0); c.fill()

    c.bezierCurveTo(56, -50, 30, -70, 4, -66); c.bezierCurveTo(-24, -62, -50, -40, -68, -6); c.fill()
    for (let i = 0; i < 6; i++) { c.beginPath(); c.arc(-50 + i * 20 - s.yaw * 4, -70 - Math.sin(i * 1.7) * 8, 15, 0, 7); c.fill() }

    c.bezierCurveTo(66, -40, 50, -60, 30, -62); c.bezierCurveTo(10, -52, -20, -66, -40, -56); c.bezierCurveTo(-58, -44, -66, -24, -72, -4); c.fill()
    c.fillStyle = L.hairL; c.beginPath(); c.moveTo(0, -100); c.quadraticCurveTo(30, -112, 50, -92); c.quadraticCurveTo(24, -98, 0, -100); c.fill()
  }

function arm(c, col, pts, w) { c.strokeStyle = col; c.lineWidth = w; c.lineJoin = 'round'; c.lineCap = 'round'; c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) c.lineTo(p[0], p[1]); c.stroke() }
function drawPerson(c, who, x, y, s, mouth, t) {

  const breath = Math.sin(t * 1.7 + (who === 'el' ? 1 : 0)) * 1.5

function state(who, t) {

  for (const k of ['yaw', 'gx', 'gy', 'lid', 'browL', 'browR', 'browIn', 'smile', 'tilt', 'dy', 'shoulder', 'phone', 'play', 'lean', 'pose', 'x', 'walk', 'mopen']) s[k] = A[k] ? track(t, A[k]) : 0

}
function mouthAt(who, t) {
  const E = TL.env[who], f = t * TL.fps, i = Math.floor(f)
  const v = (k) => E[Math.max(0, Math.min(E.length - 1, k))] || 0
  return (v(i - 1) * 0.25 + v(i) * 0.5 + v(i + 1) * 0.25) * 1.15

// ---------- subtitles ----------
const SUB = {
  A: { font: '700 56px Inter', y: 1500, outline: 7, box: false, maxW: 940, lh: 68 },
  B: { font: '600 52px Inter', y: 1530, outline: 0, box: true, maxW: 840, lh: 64 },
  C: { font: '700 46px Inter', y: 1690, outline: 4, box: false, maxW: 900, lh: 56, shadow: true },

function wrap(text, maxW) {

}

}

function shotAt(t) { let k = 0; for (let i = 0; i < SHOTS.length; i++) if (t >= SHOTS[i][0]) k = i; return k }
