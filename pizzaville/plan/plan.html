// ---------- flags ----------
function star(c, cx, cy, r, col) { c.fillStyle = col; c.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI/2 + i*Math.PI/5, rr = i%2 ? r*0.42 : r; c.lineTo(cx + rr*Math.cos(a), cy + rr*Math.sin(a)); } c.fill(); }
function hs(c,x,y,w,h,cols){ cols.forEach((col,i)=>{ c.fillStyle=col; c.fillRect(x, y+h*i/cols.length, w, h/cols.length+0.5); }); }
function vs(c,x,y,w,h,cols){ cols.forEach((col,i)=>{ c.fillStyle=col; c.fillRect(x+w*i/cols.length, y, w/cols.length+0.5, h); }); }
function drawFlag(c, code, x, y, w, h) {
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
  switch (code) {
    case 'es': c.fillStyle='#c60b1e'; c.fillRect(x,y,w,h); c.fillStyle='#ffc400'; c.fillRect(x,y+h/4,w,h/2); break;
    case 'mx': vs(c,x,y,w,h,['#006847','#fff','#ce1126']); c.fillStyle='#8c5a2b'; c.beginPath(); c.arc(x+w/2,y+h/2,h*0.16,0,7); c.fill(); break;
    case 'ar': hs(c,x,y,w,h,['#74acdf','#fff','#74acdf']); c.fillStyle='#f6b40e'; c.beginPath(); c.arc(x+w/2,y+h/2,h*0.12,0,7); c.fill(); break;
    case 'cl': c.fillStyle='#fff'; c.fillRect(x,y,w,h/2); c.fillStyle='#d52b1e'; c.fillRect(x,y+h/2,w,h/2); c.fillStyle='#0039a6'; c.fillRect(x,y,h/2,h/2); star(c,x+h/4,y+h/4,h*0.15,'#fff'); break;
    case 'co': c.fillStyle='#fcd116'; c.fillRect(x,y,w,h/2); c.fillStyle='#003893'; c.fillRect(x,y+h/2,w,h/4); c.fillStyle='#ce1126'; c.fillRect(x,y+3*h/4,w,h/4); break;
    case 'pe': vs(c,x,y,w,h,['#d91023','#fff','#d91023']); break;
    case 'bo': hs(c,x,y,w,h,['#d52b1e','#f9e300','#007934']); break;
    case 've': hs(c,x,y,w,h,['#fcd116','#00247d','#cf142b']); for (let i=0;i<8;i++){ const a=Math.PI*(0.15+0.7*i/7); star(c, x+w/2-Math.cos(a)*h*0.26, y+h*0.62-Math.sin(a)*h*0.2, h*0.04,'#fff'); } break;
    case 'bg': hs(c,x,y,w,h,['#fff','#00966e','#d62612']); break;
    case 'cu': hs(c,x,y,w,h,['#002a8f','#fff','#002a8f','#fff','#002a8f']); c.fillStyle='#cf142b'; c.beginPath(); c.moveTo(x,y); c.lineTo(x+h*0.87,y+h/2); c.lineTo(x,y+h); c.fill(); star(c,x+h*0.29,y+h/2,h*0.14,'#fff'); break;
    case 'do': { c.fillStyle='#002d62'; c.fillRect(x,y,w/2,h/2); c.fillRect(x+w/2,y+h/2,w/2,h/2); c.fillStyle='#ce1126'; c.fillRect(x+w/2,y,w/2,h/2); c.fillRect(x,y+h/2,w/2,h/2); c.fillStyle='#fff'; c.fillRect(x+w/2-h*0.09,y,h*0.18,h); c.fillRect(x,y+h/2-h*0.09,w,h*0.18); break; }
    case 'uy': hs(c,x,y,w,h,['#fff','#0038a8','#fff','#0038a8','#fff','#0038a8','#fff','#0038a8','#fff']); c.fillStyle='#fff'; c.fillRect(x,y,h*5/9,h*5/9); c.fillStyle='#fcd116'; c.beginPath(); c.arc(x+h*5/18,y+h*5/18,h*0.12,0,7); c.fill(); break;
    case 'pizz': c.fillStyle='#ff6b1a'; c.fillRect(x,y,w,h); c.fillStyle='#ffd23f'; c.beginPath(); c.moveTo(x+w*0.3,y+h*0.2); c.lineTo(x+w*0.7,y+h*0.2); c.lineTo(x+w/2,y+h*0.85); c.fill(); c.fillStyle='#d62828'; [[0.45,0.35],[0.56,0.4],[0.5,0.55]].forEach(([a,b])=>{c.beginPath();c.arc(x+w*a,y+h*b,h*0.06,0,7);c.fill();}); break;
  }
  c.restore(); c.strokeStyle='rgba(0,0,0,0.35)'; c.lineWidth=Math.max(1,h/24); c.strokeRect(x,y,w,h);
}
const flagTex = {};
function getFlagTex(code) { if (!flagTex[code]) { const cv=document.createElement('canvas'); cv.width=192; cv.height=128; drawFlag(cv.getContext('2d'),code,0,0,192,128); const t=new THREE.CanvasTexture(cv); t.anisotropy=8; flagTex[code]=t; } return flagTex[code]; }

// ---------- three ----------
let seed = 20261115; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
const gl = document.createElement('canvas');
const renderer = new THREE.WebGLRenderer({ canvas: gl, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene(); scene.background = new THREE.Color('#9fd3ff'); scene.fog = new THREE.Fog('#bfe3ff', 260, 480);
const camera = new THREE.PerspectiveCamera(+(P.get('fov')||35), W/H, 1, 1000);
camera.position.set(+(P.get('cx')||-2), +(P.get('cy')||160), +(P.get('cz')||90)); camera.lookAt(+(P.get('lx')||0), 0, +(P.get('lz')||-3));
scene.add(new THREE.HemisphereLight('#ffffff', '#4f6b2f', 0.5));
const sun = new THREE.DirectionalLight('#fff3df', 0.85); sun.position.set(-60, 110, 50); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, { left: -115, right: 115, top: 85, bottom: -85, near: 10, far: 300 }); sun.shadow.bias = -0.0005;
scene.add(sun);

const M = {}; const mat = (c, o={}) => (M[c+JSON.stringify(o)] ||= new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.85 }, o)));
function box(w,h,d,c,x,y,z,parent,o) { const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(c,o)); m.position.set(x,y,z); m.castShadow=m.receiveShadow=true; (parent||scene).add(m); return m; }
function cyl(rt,rb,h,c,x,y,z,parent,seg=12,o) { const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat(c,o)); m.position.set(x,y,z); m.castShadow=m.receiveShadow=true; (parent||scene).add(m); return m; }
function sph(r,c,x,y,z,parent) { const m=new THREE.Mesh(new THREE.SphereGeometry(r,12,10), mat(c)); m.position.set(x,y,z); m.castShadow=true; (parent||scene).add(m); return m; }
function gable(w,h,d,c,x,y,z,parent) { const m=new THREE.Mesh(new THREE.CylinderGeometry(1,1,d,3), mat(c)); m.rotation.set(-Math.PI/2,0,0); m.scale.set(w/1.732, 1, h/1.5); const g=new THREE.Group(); g.add(m); m.position.y=h/3; g.position.set(x,y,z); m.castShadow=true; (parent||scene).add(g); return g; }
function plane(w,d,c,x,y,z,o) { const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d), mat(c,o)); m.rotation.x=-Math.PI/2; m.position.set(x,y,z); m.receiveShadow=true; scene.add(m); return m; }

// terreno
plane(800, 800, '#7fb85a', 0, 0, 0);
for (let i = 0; i < 260; i++) { const x=(rnd()-0.5)*200, z=(rnd()-0.5)*140; plane(6+rnd()*10, 6+rnd()*10, rnd()<0.5?'#86bf60':'#76ad52', x, 0.01, z); }
// río
const riverZ = x => -43 + 3.2*Math.sin(x/13);
for (let x = -110; x < 110; x += 2) { const z1=riverZ(x), z2=riverZ(x+2); const m=plane(2.6, 6, '#3d9be0', x+1, 0.06, (z1+z2)/2, {roughness:0.15, metalness:0.1}); m.rotation.z = Math.atan2(z2-z1, 2)*-1; plane(2.6, 8, '#d8c79a', x+1, 0.04, (z1+z2)/2).rotation.z = Math.atan2(z2-z1,2)*-1; }
// carreteras
const ASF = '#4a4d52', DIRT = '#a8865a', LINE = '#f5f1e6';
function road(x1,z1,x2,z2,w,c,dash) { const L=Math.hypot(x2-x1,z2-z1); const m=plane(L, w, c, (x1+x2)/2, 0.08, (z1+z2)/2); m.rotation.z = -Math.atan2(z2-z1,x2-x1); if (dash) for (let t=1.5;t<L;t+=4){ const k=t/L; const d=plane(1.8,0.22,LINE,x1+(x2-x1)*k,0.1,z1+(z2-z1)*k); d.rotation.z=m.rotation.z; } return m; }
plane(14, 14, '#c9c2b3', 0, 0.07, 0); // plaza
road(-84, 0, 78, 0, 5.2, ASF, true);          // avenida principal
road(0, 2, 0, 38, 5.2, ASF, true);            // avenida sur
for (const z of [-20, 20]) { road(-46, z, 78, z, 3.4, ASF); road(-84, z, -46, z, 3.4, DIRT); }
road(-84, -34, -84, 34, 3.4, DIRT); road(78, -34, 78, 34, 3.4, DIRT);
road(-40, -2, -40, -36, 2.4, DIRT); // camino al río
for (let x = -82; x < -48; x += 3) for (const z of [-20, 20]) { cyl(0.05,0.32,0.8,'#ff7a00',x,0.45,z+1.9); }
// asfaltadora y apisonadora
function roller(x,z,ry) { const g=new THREE.Group(); box(2.6,1.2,1.6,'#f2c230',0,1.0,0,g); cyl(0.7,0.7,1.8,'#555',1.3,0.7,0,g).rotation.x=Math.PI/2; cyl(0.7,0.7,1.8,'#555',-1.3,0.7,0,g).rotation.x=Math.PI/2; box(1,0.9,1.2,'#333',-0.3,2.0,0,g,{roughness:0.3}); g.position.set(x,0,z); g.rotation.y=ry; scene.add(g); }
roller(-50, -20, 0); roller(-56, 20, Math.PI);
function excavator(x,z,ry) { const g=new THREE.Group(); box(3,0.6,2.2,'#333',0,0.3,0,g); box(2.4,1.4,2,'#f2c230',0,1.3,0,g); box(1,1.1,1,'#c9e6ff',0.6,2.4,0.4,g,{roughness:0.2}); const a=box(3.4,0.4,0.4,'#f2c230',2.6,2.6,0,g); a.rotation.z=0.5; const b=box(2.6,0.35,0.35,'#f2c230',4.6,2.2,0,g); b.rotation.z=-1.0; box(0.9,0.7,1,'#555',5.2,1.0,0,g); g.position.set(x,0,z); g.rotation.y=ry; scene.add(g); }
excavator(-70, -23, 0.6); excavator(-84, 10, -1.4); excavator(76, -8, 2.2); excavator(-44, -30, 1.2);
function truck(x,z,ry,load) { const g=new THREE.Group(); box(4.2,1.6,2,'#e8e8e8',-0.6,1.4,0,g); box(1.6,1.8,2,load||'#e05a2b',2.3,1.4,0,g); box(0.2,0.8,1.8,'#9fd3ff',3.15,1.8,0,g,{roughness:0.2}); for (const [a,b] of [[-2,1],[-2,-1],[2.2,1],[2.2,-1]]) cyl(0.5,0.5,0.4,'#222',a,0.5,b,g).rotation.x=Math.PI/2; if (load==='mix') { const d=cyl(0.9,0.6,3,'#ddd',-0.6,2.4,0,g); d.rotation.z=Math.PI/2+0.2; } g.position.set(x,0,z); g.rotation.y=ry; scene.add(g); return g; }
truck(-28, 1.3, 0, '#2a7de1'); truck(36, -1.3, Math.PI, 'mix'); truck(-64, -1.3, Math.PI, '#e05a2b'); truck(0.8, 30, -Math.PI/2, '#2fa84f'); truck(60, 21, 0, 'mix');
// grúas
function crane(x,z,ry,h=17) { const g=new THREE.Group(); const Y='#f2b705'; box(1,h,1,Y,0,h/2,0,g); for (let y=1;y<h;y+=1.4){ const d=box(1.35,0.12,0.12,'#d49a00',0,y,0.5,g); d.rotation.z=0.7; } box(16,0.7,0.7,Y,3.5,h+0.4,0,g); box(2.4,1.6,1.2,'#888',-3.5,h-0.6,0,g); box(1.2,1.1,1.2,'#c9e6ff',0,h-0.3,0.9,g); const cable=cyl(0.04,0.04,h-6,'#222',10,h-(h-6)/2,0,g,4); box(1.4,0.8,1.4,'#b5651d',10,6,0,g); g.position.set(x,0,z); g.rotation.y=ry; scene.add(g); }

// árboles
function tree(x,z,s=1) { if (rnd()<0.55) { cyl(0.18*s,0.25*s,1.6*s,'#7a5230',x,0.8*s,z); sph(1.3*s, rnd()<0.5?'#3f8f34':'#4fa83d', x, 2.4*s, z); } else { cyl(0.15*s,0.2*s,1.2*s,'#6b4423',x,0.6*s,z); const c=new THREE.Mesh(new THREE.ConeGeometry(1.2*s,3.4*s,8), mat('#2f7a37')); c.position.set(x,2.6*s,z); c.castShadow=true; scene.add(c); } }
for (let i = 0; i < 520; i++) { const x=(rnd()-0.5)*260, z=-120+rnd()*190; if (x>-90 && x<84 && z>-37 && z<44) continue; if (Math.abs(z-riverZ(x))<6) continue; tree(x,z,0.8+rnd()*0.7); }

// ---------- casas ----------
const labels = [];
const WALLS = ['#f3e9d2','#f6d7b0','#e8eef2','#f2d0c4','#fbe7a1','#d9ead3','#e6dcf5','#fff4e6'];
const ROOFS = ['#c8553d','#b5462f','#8c3b2e','#3d5a80','#6b8f3a','#9a4f2a'];
function flagPole(g, code, x, z, h=4.2) { cyl(0.07,0.07,h,'#ddd',x,h/2,z,g,6); const f=new THREE.Mesh(new THREE.PlaneGeometry(1.8,1.2), new THREE.MeshStandardMaterial({ map:getFlagTex(code), side:THREE.DoubleSide, roughness:0.9 })); f.position.set(x+0.92,h-0.65,z); f.castShadow=true; g.add(f); }
function pool(g,x,z,w,d) { box(w+0.6,0.25,d+0.6,'#e9e4d8',x,0.12,z,g); box(w,0.06,d,'#2fb4e8',x,0.27,z,g,{roughness:0.1,metalness:0.1}); }
function person(x,z,shirt,worker,parent) { const g=new THREE.Group(); cyl(0.26,0.3,0.9,worker?'#ff7a00':shirt,0,0.85,0,g,8); cyl(0.1,0.1,0.45,'#2b2b3a',-0.12,0.22,0,g,6); cyl(0.1,0.1,0.45,'#2b2b3a',0.12,0.22,0,g,6); sph(0.24,'#f0c6a0',0,1.52,0,g); if (worker) { const hm=new THREE.Mesh(new THREE.SphereGeometry(0.27,10,6,0,Math.PI*2,0,Math.PI/2), mat('#ffd400')); hm.position.y=1.6; g.add(hm); } g.position.set(x,0,z); g.rotation.y=rnd()*6.28; (parent||scene).add(g); return g; }
function basic(g, wall, roof, floors=1, w=3.6, d=3.4) { const h=2.4*floors; box(w,h,d,wall,0,h/2,0,g); gable(w+0.4, 1.6, d+0.4, roof, 0, h, 0, g); box(0.8,1.4,0.1,'#6b3e26',0,0.7,d/2+0.02,g); for (let f=0; f<floors; f++) for (const sx of [-1,1]) box(0.7,0.6,0.08,'#9fd3ff',sx*1.05,1.5+f*2.4,d/2+0.03,g,{roughness:0.2}); return h+1.6; }
function construction(g, stage) {
  box(4.2,0.3,4,'#b9b5ad',0,0.15,0,g);
  if (stage === 'base') { for (let i=0;i<9;i++) cyl(0.04,0.04,1.4,'#7a3d1a',-1.6+(i%3)*1.6,1,-1.5+Math.floor(i/3)*1.5,g,4); box(1.2,0.6,1,'#b5532f',2.4,0.6,1.8,g); box(1.2,0.6,1,'#b5532f',2.4,1.2,1.8,g); return 2; }
  box(3.6,1.3,0.25,'#d9c3a5',0,0.95,-1.6,g); box(0.25,1.3,3.2,'#d9c3a5',-1.7,0.95,0,g); box(1.6,1.0,0.25,'#d9c3a5',-0.9,0.8,1.6,g);
  for (const [a,b] of [[-1.9,-1.8],[1.9,-1.8],[-1.9,1.8],[1.9,1.8]]) box(0.12,4.2,0.12,'#c49a5a',a,2.1,b,g);
  for (const y of [1.6,3.2]) { box(4,0.1,0.12,'#c49a5a',0,y,1.8,g); box(4,0.1,0.12,'#c49a5a',0,y,-1.8,g); box(0.12,0.1,3.6,'#c49a5a',1.9,y,0,g); }
  box(3.8,0.1,0.8,'#8a6a3a',0,1.6,2.3,g); return 4.4;
}
function build(type, stage, wall, roof, g, code) {
  if (stage !== 'done') return construction(g, stage);
  switch (type) {
    case 'two': return basic(g, wall, roof, 2);
    case 'pueblo': { const h=basic(g, '#fbf8f0', '#c1502e', 2, 4, 3.6); box(2.4,0.15,0.8,'#7a4a2a',0,3.0,2.2,g); box(2.4,0.6,0.08,'#7a4a2a',0,3.35,2.6,g); for (const sx of [-1.3,1.3]) { box(0.5,0.5,0.5,'#c1502e',sx,2.85,2.3,g); sph(0.35,'#e0457b',sx,3.25,2.3,g); } return h; }
    case 'piscina': { const h=basic(g, wall, roof); pool(g, 0, -3.6, 3.2, 1.8); return h; }
